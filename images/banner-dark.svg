<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Daniel Macedo, Backend and Full-Stack Developer">
  <title>Daniel Macedo, Backend &amp; Full-Stack Developer</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f1419" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; }
      .name { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; font-weight: 800; font-size: 68px; letter-spacing: 6px; }
      .g1 { animation: g1 6s infinite steps(1); }
      .g2 { animation: g2 6s infinite steps(1); }
      .cursor { animation: blink 1.1s infinite steps(1); }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes g1 { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 90% { transform: translate(-7px,0); opacity: 1; } 93% { transform: translate(4px,-2px); } 96% { transform: translate(-3px,1px); } }
      @keyframes g2 { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 90% { transform: translate(6px,0); opacity: 1; } 93% { transform: translate(-5px,2px); } 96% { transform: translate(3px,-1px); } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .g1,.g2,.cursor,.pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#000000"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <!-- circuito decorativo à direita -->
    <g stroke="#8b949e" stroke-width="2" fill="none" opacity="0.8">
      <path d="M1200 70H1080l-30 30H930"/>
      <path d="M1200 120H1110l-20 20H990l-25 25H880"/>
      <path d="M1200 190H1060l-35-35H950"/>
      <path d="M1200 240H1120l-25 25H1000"/>
    </g>
    <g fill="#00e5ff" class="pulse">
      <circle cx="930" cy="100" r="4"/><circle cx="880" cy="165" r="4"/>
    </g>
    <g fill="#ff2bd6" class="pulse" style="animation-delay:1.5s">
      <circle cx="950" cy="155" r="4"/><circle cx="1000" cy="265" r="4"/>
    </g>
    <rect width="1200" height="300" fill="url(#fade)"/>
    <rect width="1200" height="300" fill="url(#scan)"/>

    <text x="64" y="92" class="mono" font-size="20" fill="#8b949e">~/daniel <tspan fill="#00e5ff">❯</tspan> whoami<tspan class="cursor" fill="#ffffff"> ▋</tspan></text>

    <g class="name">
      <text x="62" y="174" fill="#00e5ff" opacity="0.55" class="g1">DANIEL MACEDO</text>
      <text x="62" y="174" fill="#ff2bd6" opacity="0.55" class="g2">DANIEL MACEDO</text>
      <text x="62" y="174" fill="#ffffff">DANIEL MACEDO</text>
    </g>

    <text x="64" y="218" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#c9d1d9">Backend &amp; Full-Stack Developer<tspan fill="#8b949e" font-weight="400">  ·  São Paulo, BR</tspan></text>
    <text x="64" y="254" class="mono" font-size="17" fill="#8b949e">Java · Spring Boot · TypeScript · React · Python</text>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
